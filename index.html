<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101629">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23101629'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='%23ffd477'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<title>Starlight Sprint</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:dark;--ink:#f7f7ff;--muted:#a3abc3;--pink:#ff70bd;--cyan:#76e8ff;--glass:rgba(16,22,41,.74)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101629;color:var(--ink);font-family:'DM Sans',sans-serif;touch-action:none}button{font:inherit;color:inherit}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,13,28,.32),transparent 25%,transparent 60%,rgba(8,13,28,.42));z-index:1}.hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:max(20px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}.topbar{display:flex;justify-content:space-between;align-items:flex-start}.brand{display:flex;align-items:center;gap:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.04em;font-size:17px}.brandmark{width:37px;height:37px;border:1px solid #ffffff47;background:#ffffff13;border-radius:12px;display:grid;place-items:center;color:#ffd477;font-size:20px;box-shadow:0 6px 24px #0002}.brand small{display:block;font:600 9px 'DM Sans',sans-serif;letter-spacing:.2em;color:#aab4cf;margin-top:3px}.scorebox{display:flex;gap:10px}.stat{min-width:94px;padding:10px 14px;border:1px solid #ffffff26;background:var(--glass);backdrop-filter:blur(14px);border-radius:14px;text-align:right}.stat label{display:block;font-size:9px;font-weight:700;letter-spacing:.2em;color:#abb3cc}.stat strong{font:700 20px 'Space Grotesk',sans-serif}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.hint{font-size:12px;color:#d4d9e8;text-shadow:0 2px 8px #000;line-height:1.55}.hint b{color:#fff}.progress{height:3px;background:#ffffff30;border-radius:4px;width:min(34vw,230px);margin-top:8px;overflow:hidden}.progress span{height:100%;width:0;display:block;background:linear-gradient(90deg,#ff70bd,#ffd477);border-radius:4px;transition:width .2s}.controls{display:flex;gap:11px;pointer-events:auto}.ctrl{width:57px;height:57px;border-radius:19px;border:1px solid #ffffff40;background:#18223acc;backdrop-filter:blur(8px);font-size:22px;display:grid;place-items:center;box-shadow:0 8px 26px #0003;user-select:none;-webkit-tap-highlight-color:transparent}.ctrl:active{transform:scale(.94);background:#394061}.modal{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 45%,#11172d16,#09101dc2);transition:opacity .3s}.modal.hidden{opacity:0;pointer-events:none}.card{width:min(440px,100%);padding:36px 36px 31px;text-align:center;border-radius:28px;border:1px solid #ffffff28;background:linear-gradient(145deg,#222941ef,#11182bed);box-shadow:0 24px 90px #03081788;backdrop-filter:blur(22px)}.eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#ff9acd;font-weight:800}.card h1{font:700 clamp(38px,9vw,58px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.07em;margin:15px 0 12px}.card p{color:#bac2d6;line-height:1.6;font-size:14px;margin:0 auto 23px;max-width:330px}.primary{border:0;border-radius:15px;padding:14px 28px;background:linear-gradient(100deg,#ff65b6,#ffb26f);color:#28132b;font-weight:800;box-shadow:0 8px 25px #ff70bd44;cursor:pointer;min-width:180px}.primary:active{transform:translateY(1px)}.keys{margin-top:19px;font-size:10px;color:#8590aa;letter-spacing:.05em}.toast{position:absolute;z-index:3;top:24%;left:50%;transform:translate(-50%,-10px);opacity:0;transition:.25s;font-size:12px;font-weight:700;letter-spacing:.12em;color:#fff;background:#151c32cc;border:1px solid #ffffff30;padding:9px 15px;border-radius:20px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.hud{padding-left:16px;padding-right:16px}.brand{font-size:14px}.brandmark{width:34px;height:34px}.stat{min-width:78px;padding:8px 11px}.stat strong{font-size:17px}.hint{font-size:10px;max-width:48%}.ctrl{width:52px;height:52px;border-radius:17px}.card{padding:31px 24px 27px}.scorebox{gap:7px}}
</style>
</head>
<body>
<div id="game"></div><div class="vignette"></div>
<div class="hud">
  <div class="topbar"><div class="brand"><div class="brandmark">✦</div><div>STARLIGHT<small>SPRINT · NIGHT GARDEN</small></div></div><div class="scorebox"><div class="stat"><label>STARS</label><strong id="score">000</strong></div><div class="stat"><label>DISTANCE</label><strong><span id="distance">0</span><small style="font:600 10px 'DM Sans';color:#aab3cb"> m</small></strong></div></div></div>
  <div class="bottom"><div class="hint"><b>Swipe</b> or tap arrows to move · <b>↑</b> jump<br><div class="progress"><span id="progress"></span></div></div><div class="controls"><button class="ctrl" id="left" aria-label="Move left">‹</button><button class="ctrl" id="jump" aria-label="Jump">↑</button><button class="ctrl" id="right" aria-label="Move right">›</button></div></div>
</div>
<div class="toast" id="toast">NICE CATCH!</div>
<div class="modal" id="modal"><div class="card"><div class="eyebrow" id="eyebrow">A little night adventure</div><h1 id="title">Chase the<br>starlight.</h1><p id="message">Run through a dreamy garden, scoop up the floating stars, and see how far your stride can take you.</p><button class="primary" id="play">Start running&nbsp; ↗</button><div class="keys">← → change lanes &nbsp; · &nbsp; SPACE jump</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11182c);scene.fog=new THREE.Fog(0x11182c,24,90);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,150);camera.position.set(0,5.1,10.5);camera.lookAt(0,1.3,-4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9c8ff,0x263244,2.1));const moon=new THREE.DirectionalLight(0xdce9ff,3.3);moon.position.set(-5,10,5);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);const pinkLight=new THREE.PointLight(0xff60b4,21,24);pinkLight.position.set(2,3,-8);scene.add(pinkLight);const blueLight=new THREE.PointLight(0x43cfff,20,25);blueLight.position.set(-5,3,-17);scene.add(blueLight);
const mat=(color,roughness=.65,metalness=0,emissive=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness,emissive,emissiveIntensity:emissive?1:0});
const floorMat=mat(0x202c43,.9);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,150),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(0,-.08,-38);floor.receiveShadow=true;scene.add(floor);
const track=new THREE.Mesh(new THREE.PlaneGeometry(8,130),mat(0x29354d,.78));track.rotation.x=-Math.PI/2;track.position.set(0,0,-38);track.receiveShadow=true;scene.add(track);
const laneLines=[];for(const x of [-1.34,1.34]){const line=new THREE.Mesh(new THREE.BoxGeometry(.035,.025,130),new THREE.MeshBasicMaterial({color:0x8290ac,transparent:true,opacity:.38}));line.position.set(x,.012,-38);scene.add(line);laneLines.push(line)}
// Distant dreamy skyline and glowing garden arches
const starsSky=new THREE.Group();scene.add(starsSky);for(let i=0;i<100;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(Math.random()*.025+.008,6,6),new THREE.MeshBasicMaterial({color:i%5===0?0xffd68c:0xd9e6ff,transparent:true,opacity:.3+Math.random()*.6}));m.position.set((Math.random()-.5)*95,3+Math.random()*27,-15-Math.random()*75);starsSky.add(m)}
const scenery=new THREE.Group();scene.add(scenery);const archMat=new THREE.MeshStandardMaterial({color:0xb55c9f,emissive:0x741a66,emissiveIntensity:.75,roughness:.36,metalness:.25});
function arch(z){const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(5.1,.075,8,64,Math.PI),archMat);ring.position.set(0,.1,0);g.add(ring);for(const x of [-4.7,4.7]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.055,.11,4.1,8),archMat);p.position.set(x,2,0);g.add(p)}g.position.z=z;scenery.add(g);return g}const arches=[arch(-9),arch(-35),arch(-61),arch(-87)];
const plantMat=mat(0x317d77,.8),leafMat=mat(0x65b98d,.7),potMat=mat(0x36405b,.8);const decor=[];
function makePlant(x,z){const g=new THREE.Group();const pot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.38,10),potMat);pot.position.y=.2;g.add(pot);for(let i=0;i<5;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.13,.9,7),i%2?leafMat:plantMat);leaf.position.set(Math.sin(i*1.25)*.21,.7,Math.cos(i*1.25)*.19);leaf.rotation.z=Math.sin(i*1.25)*.42;g.add(leaf)}g.position.set(x,0,z);scenery.add(g);decor.push(g)}for(let z=-5;z>-95;z-=5.5){makePlant(-5.3,z);makePlant(5.3,z)}
// Fully clothed adult runner, built from soft low-poly geometry.
const runner=new THREE.Group();scene.add(runner);runner.position.set(0,0,2.4);
const skin=mat(0xd99b7c,.75),hair=mat(0x362638,.82),topMat=mat(0xff78b8,.45),pantsMat=mat(0x303d62,.62),shoeMat=mat(0xffd381,.4),soleMat=mat(0x3e3048,.7);
function addMesh(parent,geometry,material,x,y,z){const o=new THREE.Mesh(geometry,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// legs, torso, jacket details, head and ponytail
const hips=new THREE.Group();hips.position.y=1.02;runner.add(hips);
const torso=addMesh(hips,new THREE.CapsuleGeometry(.34,.66,5,10),topMat,0,.49,0);torso.scale.set(1,.95,.72);
const belt=addMesh(hips,new THREE.CylinderGeometry(.33,.31,.12,12),mat(0xffd477,.35,.3),0,.17,0);belt.scale.z=.75;
const head=addMesh(hips,new THREE.SphereGeometry(.245,14,12),skin,0,1.2,0);head.scale.set(.84,1.07,.82);
const hairCap=addMesh(hips,new THREE.SphereGeometry(.255,12,10),hair,0,1.34,-.025);hairCap.scale.set(.88,.7,.87);
const pony=addMesh(hips,new THREE.CapsuleGeometry(.095,.38,4,8),hair,-.2,1.08,-.13);pony.rotation.x=-.45;pony.rotation.z=-.42;
const visor=addMesh(hips,new THREE.BoxGeometry(.28,.055,.025),mat(0x51384b,.3,.15),0,1.23,.205);visor.rotation.z=-.08;
// little jacket collar and center seam
const collar=addMesh(hips,new THREE.ConeGeometry(.13,.21,4),mat(0xffc7df,.55),0,.91,.14);collar.rotation.z=Math.PI;
const armPivots=[];for(const s of [-1,1]){const arm=new THREE.Group();arm.position.set(s*.36,.76,0);hips.add(arm);addMesh(arm,new THREE.CapsuleGeometry(.095,.47,4,8),topMat,s*.02,-.26,0).rotation.z=s*.14;addMesh(arm,new THREE.SphereGeometry(.105,10,8),skin,s*.06,-.55,.015);armPivots.push(arm)}
const legPivots=[];for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.17,.14,0);hips.add(leg);addMesh(leg,new THREE.CapsuleGeometry(.14,.48,5,8),pantsMat,0,-.34,0);addMesh(leg,new THREE.BoxGeometry(.2,.14,.36),shoeMat,0,-.67,.09);addMesh(leg,new THREE.BoxGeometry(.205,.045,.36),soleMat,0,-.735,.09);legPivots.push(leg)}
const scarf=addMesh(hips,new THREE.BoxGeometry(.1,.3,.06),mat(0xffd477,.45),.1,.77,-.27);scarf.rotation.z=-.35;
// collectible star meshes and obstacles
const orbMat=new THREE.MeshStandardMaterial({color:0xffe59b,emissive:0xffa523,emissiveIntensity:2,metalness:.25,roughness:.2});const orbs=[];const obstacleMat=mat(0x67547b,.46,.3);const obstacleGlow=new THREE.MeshStandardMaterial({color:0xff7299,emissive:0xc52c77,emissiveIntensity:.8,roughness:.3});const obstacles=[];
function addStar(lane,z){const group=new THREE.Group();const core=new THREE.Mesh(new THREE.OctahedronGeometry(.27,0),orbMat);group.add(core);const halo=new THREE.Mesh(new THREE.TorusGeometry(.35,.018,6,24),new THREE.MeshBasicMaterial({color:0xffe5a1,transparent:true,opacity:.7}));group.add(halo);group.position.set(lane*2.15,1.16,z);group.userData={taken:false,phase:Math.random()*5};scene.add(group);orbs.push(group)}
function addObstacle(lane,z,type){const g=new THREE.Group();if(type===0){const box=addMesh(g,new THREE.BoxGeometry(.82,.72,.68),obstacleMat,0,.38,0);box.rotation.y=.12;for(const y of [.22,.52]){const stripe=addMesh(g,new THREE.BoxGeometry(.85,.08,.7),obstacleGlow,0,y,.01);stripe.rotation.y=.12}}else{const post=addMesh(g,new THREE.CylinderGeometry(.28,.34,.9,8),obstacleMat,0,.46,0);const cap=addMesh(g,new THREE.SphereGeometry(.29,8,6),obstacleGlow,0,.92,0);cap.scale.y=.5}g.position.set(lane*2.15,0,z);g.userData={kind:type};scene.add(g);obstacles.push(g)}
let score=0,distance=0,speed=14,running=false,gameOver=false,lane=0,jumpY=0,jumpV=0,spawnTimer=1.3,starTimer=.45,elapsed=0;const scoreEl=document.querySelector('#score'),distanceEl=document.querySelector('#distance'),progressEl=document.querySelector('#progress'),modal=document.querySelector('#modal');
function reset(){for(const o of [...orbs]){scene.remove(o)}orbs.length=0;for(const o of [...obstacles])scene.remove(o);obstacles.length=0;score=0;distance=0;speed=14;lane=0;jumpY=0;jumpV=0;spawnTimer=1.1;starTimer=.6;elapsed=0;runner.position.x=0;scoreEl.textContent='000';distanceEl.textContent='0';progressEl.style.width='0%';gameOver=false;running=true;modal.classList.add('hidden')}
function endGame(){running=false;gameOver=true;document.querySelector('#eyebrow').textContent='Beautiful run';document.querySelector('#title').innerHTML='You found<br>'+score+' stars.';document.querySelector('#message').textContent='You travelled '+Math.floor(distance)+' metres through the night garden. Ready to take another lap?';document.querySelector('#play').textContent='Run again  ↗';document.querySelector('.keys').textContent='Your best is saved for this session';modal.classList.remove('hidden')}
function start(){document.querySelector('#eyebrow').textContent='A little night adventure';document.querySelector('#title').innerHTML='Chase the<br>starlight.';document.querySelector('#message').textContent='Run through a dreamy garden, scoop up the floating stars, and see how far your stride can take you.';document.querySelector('#play').textContent='Start running  ↗';document.querySelector('.keys').textContent='← → change lanes  ·  SPACE jump';reset()}
function move(d){if(!running)return;lane=Math.max(-1,Math.min(1,lane+d))}function jump(){if(running&&jumpY<=.01){jumpV=8.5}}
document.querySelector('#play').addEventListener('click',start);document.querySelector('#left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});document.querySelector('#right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowUp',' ','w','W'].includes(e.key)){e.preventDefault();jump()}if(e.key==='Enter'&&!running)start()});let touchStart=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchStart=[e.clientX,e.clientY]});renderer.domElement.addEventListener('pointerup',e=>{if(!touchStart||!running)return;const dx=e.clientX-touchStart[0],dy=e.clientY-touchStart[1];if(Math.abs(dx)>25){move(dx>0?1:-1)}else if(dy<-20)jump();touchStart=null});
const clock=new THREE.Clock();function update(dt){elapsed+=dt;runner.position.x+=(lane*2.15-runner.position.x)*Math.min(1,dt*11);runner.position.y=jumpY;hips.rotation.z=Math.sin(elapsed*11)*.035;hips.rotation.x=Math.sin(elapsed*11)*.035;legPivots[0].rotation.x=Math.sin(elapsed*11)*.65;legPivots[1].rotation.x=-Math.sin(elapsed*11)*.65;armPivots[0].rotation.x=-Math.sin(elapsed*11)*.55;armPivots[1].rotation.x=Math.sin(elapsed*11)*.55;scarf.rotation.z=-.35+Math.sin(elapsed*9)*.13;
if(jumpY>0||jumpV>0){jumpY+=jumpV*dt;jumpV-=22*dt;if(jumpY<0){jumpY=0;jumpV=0}}
speed=Math.min(23,14+distance*.012);distance+=speed*dt;distanceEl.textContent=Math.floor(distance);progressEl.style.width=(Math.min(100,distance/5))+'%';
spawnTimer-=dt;starTimer-=dt;if(spawnTimer<=0){const ln=Math.floor(Math.random()*3)-1;addObstacle(ln,-48);if(Math.random()<.38){const second=[-1,0,1].filter(n=>n!==ln)[Math.floor(Math.random()*2)];addObstacle(second,-59)}spawnTimer=Math.max(.78,1.5-distance*.0009)+Math.random()*.45}
if(starTimer<=0){const ln=Math.floor(Math.random()*3)-1;for(let i=0;i<5;i++)addStar(ln,-33-i*2.2);starTimer=2.2+Math.random()*1.5}
for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];o.position.z+=speed*dt;o.rotation.y+=dt*2.3;o.rotation.z+=dt*.7;o.position.y=1.17+Math.sin(elapsed*3+o.userData.phase)*.12;if(o.position.z>5){scene.remove(o);orbs.splice(i,1);continue}if(!o.userData.taken&&Math.abs(o.position.z-runner.position.z)<.8&&Math.abs(o.position.x-runner.position.x)<.85&&Math.abs(jumpY)<1.9){o.userData.taken=true;scene.remove(o);orbs.splice(i,1);score++;scoreEl.textContent=String(score).padStart(3,'0');const toast=document.querySelector('#toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),550)}}
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(o.position.z>5){scene.remove(o);obstacles.splice(i,1);continue}if(Math.abs(o.position.z-runner.position.z)<.82&&Math.abs(o.position.x-runner.position.x)<.8&&jumpY<.95){endGame();break}}
for(const a of arches){a.position.z+=speed*dt;if(a.position.z>7)a.position.z-=104}for(const d of decor){d.position.z+=speed*dt;if(d.position.z>5)d.position.z-=99}
camera.position.x+=(runner.position.x*.16-camera.position.x)*dt*2;camera.lookAt(runner.position.x*.12,1.3,-4);pinkLight.position.x=Math.sin(elapsed*.35)*4;}
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta());if(running)update(dt);else{elapsed+=dt;runner.position.y=Math.sin(elapsed*1.5)*.045;for(const a of arches){a.position.z+=dt*1.3;if(a.position.z>7)a.position.z-=104}for(const d of decor){d.position.z+=dt*1.3;if(d.position.z>5)d.position.z-=99}}renderer.render(scene,camera)}frame();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script>
</body>
</html>
